schema: spec-driven

context: |
  set-copilot — a CLI + library that captures audio, streams it to Soniox for
  speech-to-text, and writes sentence-level JSONL that a Claude Code session reads.
  There is no server and no second AI: the "copilot intelligence" IS the Claude Code
  session running the skills in skills/.

  Tech stack: TypeScript (strict), Node.js (ESM), vitest. No linter — `tsc` strict is
  the only static check. Build with `npm run build` (tsc → dist/); bin + exports point
  at dist. `set-copilot doctor` verifies the audio chain + Soniox creds end-to-end.

  Architecture: audio.ts (parec/sox → 16kHz s16le) → soniox-rt.ts (WS stt-rt-v5) →
  transcript-writer.ts (buffers, flushes JSONL on sentence/speaker-change/silence/
  overflow; tags each line speaker: "mic" | "system") → capture.ts. poll.ts long-polls
  the transcript for the meeting-copilot loop. Knowledge adapters in src/knowledge/.

  Core conventions (read CLAUDE.md before proposing changes):
  - "Everything project-specific is config, not code." Domain behavior belongs behind
    the config seams (copilot.alerts, detect.urgency/question, knowledge.keywords),
    NEVER as a regex in src/. The engine is knowledge- and language-agnostic.
  - The mic/system tag is the load-bearing primitive — build features on it, not on new
    capture. Word boundaries are Unicode (\p{L}\p{N}), never \b.
  - Skills in skills/ are PROMPTS, not code: mechanics in the skill, judgement in config.
  - Tests cover pure logic only (no mic/Soniox/PID); verify audio paths by running the CLI.
  - Runtime-dir invariants: a capture owns its runtime dir; a transcript is handed over
    exactly once (archive, never truncate); a second capture in a live dir is refused.

  Direction and rationale live in docs/ROADMAP.md; research notes in docs/research/.

# Per-artifact rules — additive to the schema's built-in guidance, injected into
# `openspec instructions <artifact>`. Artifact IDs of spec-driven: proposal, specs,
# design, tasks.
rules:
  specs:
    - "Each delta spec carries a `## IN SCOPE` and a `## OUT OF SCOPE` section, as plain
      bullet lists naming what this change implements and what it deliberately does not.
      Apply implements IN SCOPE only; the rules-conformance auditor and /opsx:verify check
      both sections."
    - "A requirement whose name already exists in openspec/specs/<capability>/spec.md is
      `## MODIFIED`, never `## ADDED`, and the MODIFIED block carries forward every base
      scenario (reframe an obsolete one, or move it under `## REMOVED`)."
  tasks:
    - "Every implementation task carries `[REQ: <requirement name>]`, naming the delta-spec
      requirement it implements verbatim. A task with no requirement behind it is either a
      missing requirement or overshoot."
    - "Each task group carries its own tests (vitest, pure logic) as tasks inside that
      group, not a single testing group at the end. Behaviour that needs a microphone,
      Soniox or the PID lifecycle gets a task that verifies it by running the CLI
      (e.g. `set-copilot doctor`), and any test that spawns the real CLI sets
      SET_COPILOT_HOME."

# Per-operation advisory guidance, injected into `openspec instructions apply` and the
# archive instructions (OpenSpec >= 1.14 reads operations.<apply|archive>.guidance).
operations:
  apply:
    guidance:
      - "Before implementing: openspec/changes/<name>/review-findings.md must exist and
        contain no OPEN CRITICAL. If it is missing, stop and run /opsx:review <name>
        first. If a CRITICAL is OPEN, stop: fix it in the proposal/design/tasks/spec
        artifacts and mark it RESOLVED, or get the user's explicit OK to REJECT it with a
        reason. Exempt only if proposal.md states a review skip with its reason (docs-only,
        or a retro-spec with no code task) — see .claude/rules/spec-adversarial-review.md."
      - "Implement the IN SCOPE items of the delta specs only. An OUT OF SCOPE item stays
        out even when it is obvious or useful — stop and tell the user instead."
  archive:
    guidance:
      - "Never archive with --skip-specs: the spec sync is the point of archiving here.
        Archive in dependency order — a change that MODIFIES a requirement archives after
        the change that ADDED it."
      - "A MODIFIED requirement must carry forward every base scenario. Never silently drop
        one; reframe it to its surviving intent or move it under REMOVED. A delta that
        would leave a capability empty retires it with a tombstone ADDED requirement."
      - "After archiving, run `openspec validate --specs --strict` and compare the total
        requirement count across openspec/specs/ with the count before the archive. It
        must not drop by more than the change's REMOVED requirements; an unexplained drop
        means a requirement was lost in the sync."
