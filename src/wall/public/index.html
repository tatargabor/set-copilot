<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>set-copilot wall</title>
  <!-- Inter for the `studio` presentation theme; the system stack is the offline fallback. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" />
  <link rel="stylesheet" href="/wall.css" />
  <!-- Cytoscape from CDN for the POC (design D4 / task 6.3). Vendoring for an
       offline `wall` is a noted follow-up; the graph slot degrades to empty if
       these fail to load, so text slots still work without a network. -->
  <script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
  <script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
  <script>
    // Register the dagre layout if all three scripts loaded; otherwise wall.js
    // falls back to the built-in breadthfirst layout.
    window.addEventListener("DOMContentLoaded", () => {
      try {
        if (window.cytoscape && window.cytoscapeDagre) window.cytoscape.use(window.cytoscapeDagre);
      } catch (_) { /* offline / blocked CDN — breadthfirst fallback */ }
    });
  </script>
</head>
<body>
  <!-- Liveness status strip (wall-liveness D2): a persistent bar, NOT a grid box, so
       it survives any layout — even one that fills every box position with content. -->
  <header id="status-strip" class="status-strip">…</header>
  <main id="wall"></main>
  <script type="module" src="/wall.js"></script>
</body>
</html>
