<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live transcript</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <style>
    /* The live transcript page (wall-transcript): what was said, by whom — nothing else. */
    :root {
      --bg: #0d1220;
      --panel: rgba(255, 255, 255, 0.035);
      --line: rgba(255, 255, 255, 0.08);
      --text: #e8edf6;
      --muted: #8a9abb;
      --sp-a: #7aa7ff;
      --sp-b: #f2a65a;
      --sp-c: #4fd08a;
      --size: 20px;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --line: #dfe5ef;
        --text: #172036;
        --muted: #5d6b86;
        --sp-a: #2563eb;
        --sp-b: #c2610c;
        --sp-c: #17864a;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--line);
      flex: none;
    }
    h1 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: 0.01em; }
    .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .status.live .dot { background: #4fd08a; box-shadow: 0 0 0 0 rgba(79, 208, 138, 0.6); animation: pulse 2s infinite; }
    @keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(79, 208, 138, 0); } 100% { box-shadow: 0 0 0 0 rgba(79, 208, 138, 0); } }
    .spacer { flex: 1; }
    .legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
    .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--c); }
    button {
      font: inherit; font-size: 13px; color: var(--text); background: var(--panel);
      border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer;
    }
    button:hover { border-color: var(--muted); }
    main { flex: 1; overflow-y: auto; padding: 20px max(20px, calc((100% - 980px) / 2)); scroll-behavior: smooth; }
    .empty { color: var(--muted); font-size: 15px; text-align: center; margin-top: 18vh; }
    .turn {
      display: grid;
      grid-template-columns: 9.5em 1fr;
      gap: 4px 18px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .who { font-size: 13px; font-weight: 650; color: var(--c); padding-top: calc((var(--size) - 13px) / 2 + 2px); }
    .who small { display: block; font-weight: 500; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
    .said { font-size: var(--size); line-height: 1.5; margin: 0; overflow-wrap: anywhere; }
    .said .fresh { animation: fadein 0.6s ease-out; }
    @keyframes fadein { from { opacity: 0.25; } to { opacity: 1; } }
    #jump {
      position: fixed; right: 22px; bottom: 22px; display: none;
      background: var(--sp-a); color: #fff; border: none; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }
    #jump.show { display: block; }
    @media (max-width: 640px) {
      header { flex-wrap: wrap; padding: 10px 16px; }
      main { padding: 12px 16px; }
      .turn { grid-template-columns: 1fr; }
      .who { padding-top: 0; }
      .legend { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Live transcript</h1>
    <span class="status" id="status"><span class="dot"></span><span id="status-text">connecting…</span></span>
    <span class="spacer"></span>
    <span class="legend" id="legend"></span>
    <button id="smaller" title="Smaller text">A−</button>
    <button id="larger" title="Larger text">A+</button>
  </header>
  <main id="log"><p class="empty" id="empty">Nothing said yet — the transcript appears here as people speak.</p></main>
  <button id="jump">↓ Live</button>
  <script src="/transcript.js"></script>
</body>
</html>
